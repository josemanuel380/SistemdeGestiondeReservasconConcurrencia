services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservas-backend
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - reservas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reservas-network

networks:
  reservas-network:
    driver: bridge
